<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Vortex Strike – Multiplayer Arena Shooter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0e1a;color:#fff;font-family:"Trebuchet MS","Segoe UI",sans-serif;user-select:none}
canvas{display:block;position:fixed;inset:0}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;background:linear-gradient(160deg,rgba(8,14,34,.82),rgba(8,14,34,.55))}
.card{width:min(400px,92vw);padding:34px 32px;border-radius:10px;background:rgba(14,20,42,.88);border:1px solid #2d3b6b;box-shadow:0 24px 70px rgba(0,0,0,.55);text-align:center}
h1{font-size:44px;line-height:1;font-weight:900;letter-spacing:1px;font-style:italic;color:#ffd24a;text-shadow:3px 3px 0 #e8442e}
.sub{margin:10px 0 24px;color:#9fb0e0;font-size:14px}
input{width:100%;padding:13px 14px;border-radius:6px;border:1px solid #34457d;background:#0a1128;color:#fff;font-size:16px;outline:none;margin-bottom:12px}
input:focus,button:focus-visible{border-color:#ffd24a;box-shadow:0 0 0 2px rgba(255,210,74,.35)}
button{width:100%;padding:14px;border:0;border-radius:6px;background:#ffd24a;color:#1a1200;font-size:18px;font-weight:800;cursor:pointer;transition:transform .12s,background .12s}
button:hover:not(:disabled){background:#ffe07a;transform:translateY(-2px)}
button:disabled{opacity:.55;cursor:wait}
button.alt{background:transparent;color:#9fb0e0;border:1px solid #34457d;margin-top:10px;font-size:14px;font-weight:600}
#status{min-height:20px;margin-top:14px;color:#7fe0ff;font-size:14px}
.keys{margin-top:18px;color:#7384b8;font-size:12px;line-height:1.7}
#hud{display:none;position:fixed;inset:0;pointer-events:none;z-index:2}
#cx{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
#cx:before,#cx:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}
#cx:before{left:10px;top:0;width:2px;height:22px}#cx:after{top:10px;left:0;height:2px;width:22px}
#cx.hit:before,#cx.hit:after{background:#ff3b3b}
#cx i{position:absolute;inset:7px;background:#0a0e1a}
#hpw{position:absolute;left:24px;bottom:24px;width:240px}
#hpw small{display:block;margin-bottom:4px;font-weight:700;text-shadow:0 1px 3px #000}
#hpb{height:16px;background:rgba(0,0,0,.5);border:2px solid #fff;border-radius:3px;overflow:hidden}
#hpb b{display:block;height:100%;width:100%;background:#42e08a;transition:width .15s}
#board{position:absolute;right:16px;top:16px;min-width:190px;padding:8px 10px;background:rgba(0,0,0,.45);border-radius:6px;font-size:13px}
#board div{display:flex;justify-content:space-between;gap:16px;padding:2px 0}
#board h4{font-size:11px;color:#9fb0e0;margin-bottom:4px;font-weight:600}
#feed{position:absolute;left:16px;top:16px;font-size:14px;text-shadow:0 1px 3px #000}
#feed div{margin-bottom:4px;padding:3px 8px;background:rgba(0,0,0,.4);border-radius:4px;width:fit-content}
#dmg{position:absolute;inset:0;background:radial-gradient(transparent 40%,rgba(255,0,0,.65));opacity:0;transition:opacity .25s}
#death{display:none;position:absolute;left:0;right:0;top:36%;text-align:center;font-size:40px;font-weight:900;font-style:italic;color:#ff5a45;text-shadow:3px 3px 0 #000}
#pause{display:none}
</style></head><body>
<div id="menu" class="ov"><div class="card">
<h1>VORTEX STRIKE</h1>
<p class="sub">Fast 3D arena shooter. Up to 6 players, peer-to-peer.</p>
<input id="name" maxlength="14" placeholder="Nickname" autocomplete="off">
<button id="find">Find match</button>
<div id="status"></div>
<div class="keys">WASD move &nbsp; Space jump &nbsp; Shift sprint<br>Mouse aim &nbsp; Click shoot</div>
</div></div>
<div id="pause" class="ov"><div class="card">
<h1>READY?</h1><p class="sub" id="room"></p>
<button id="play">Click to play</button>
<button id="leave" class="alt">Leave match</button>
</div></div>
<div id="hud">
<div id="cx"><i></i></div><div id="feed"></div><div id="board"></div>
<div id="hpw"><small id="hpt">100</small><div id="hpb"><b></b></div></div>
<div id="dmg"></div><div id="death">ELIMINATED</div>
</div>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<script src="libs/three.min.js"></script>
<script src="libs/peerjs.min.js"></script>
<script src="game.js"></script>
</body></html>
